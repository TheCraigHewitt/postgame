[workspace]
resolver = "3"
# The desktop app is built with `pnpm tauri`, so plain cargo commands stay fast
# and need no frontend build. `cargo deny` still covers it as a member.
default-members = [
    "crates/pg-analysis",
    "crates/pg-asr",
    "crates/pg-capture",
    "crates/pg-cli",
    "crates/pg-dsp",
    "crates/pg-eval",
    "crates/pg-llm",
    "crates/pg-pipeline",
    "crates/pg-store",
]
members = [
    "apps/desktop/src-tauri",
    "crates/pg-analysis",
    "crates/pg-asr",
    "crates/pg-capture",
    "crates/pg-cli",
    "crates/pg-dsp",
    "crates/pg-eval",
    "crates/pg-llm",
    "crates/pg-pipeline",
    "crates/pg-store",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/TheCraigHewitt/postgame"
publish = false

[workspace.dependencies]
clap = { version = "4", features = ["derive", "string"] }
ctrlc = "3"
hound = "3.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
swift-rs = { version = "1.0.9", features = ["build"] }
tempfile = "3"
thiserror = "2"
